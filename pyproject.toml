[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "divar-latest-ads"
version = "1.0.0"
description = "A modular Python project for monitoring new Divar listings."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "playwright>=1.45,<2",
]

[project.optional-dependencies]
windows = [
    "winotify>=1.1.0",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
divar-export = "divar_monitor.__main__:main"
divar-local-monitor = "divar_monitor.local_monitor:main"
divar-cloud-monitor = "divar_monitor.cloud_monitor:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"